[advisories]
# Transitive via broker SDKs; no fixed upgrade available upstream (matches the
# same ignore already used in higgs/deny.toml elsewhere in the fleet).
ignore = [
    "RUSTSEC-2023-0071",
    # chrono / chrono-tz unmaintained, no fixed release; temporary until the
    # stack moves off chrono (security:RUSTSEC-2026-0543).
    "RUSTSEC-2026-0543",
    "RUSTSEC-2026-0555",
    # libsqlite3-sys 0.30 via sqlx-sqlite; temporary until the fleet sqlx bump
